stages:
  - lint
  - test
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always

.rust-cache:
  cache:
    key: cargo-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - target/

fmt:
  stage: lint
  image: rust:1.90
  extends: .rust-cache
  script:
    - rustup component add rustfmt
    - cargo fmt --check

clippy:
  stage: lint
  image: rust:1.90
  extends: .rust-cache
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

changelog-check:
  stage: lint
  image: rust:1.90
  script:
    - |
      if command -v chlog >/dev/null 2>&1; then
        chlog check
      else
        echo "chlog not installed, skipping changelog validation"
      fi
  allow_failure: true

# No API key: every test here is offline by design. Linting and parsing must
# never require a credential or a network call.
test:
  stage: test
  image: rust:1.90
  extends: .rust-cache
  script:
    - cargo test --all-targets

build:
  stage: build
  image: rust:1.90
  extends: .rust-cache
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/jev
    expire_in: 7 days
